<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 420px; margin: 0; font: 13px/1.5 -apple-system, "Malgun Gothic", sans-serif; color: #222; }
    header { display: flex; gap: 6px; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    header h1 { margin: 0 auto 0 0; font-size: 14px; }
    #q { width: 100%; box-sizing: border-box; margin: 8px 10px 0; width: calc(100% - 20px); padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
    ul { list-style: none; margin: 0; padding: 4px 0; max-height: 460px; overflow-y: auto; }
    li { padding: 8px 10px; border-bottom: 1px solid #f2f2f2; }
    .top { display: flex; gap: 6px; align-items: baseline; }
    .site { flex: none; font-size: 11px; font-weight: 700; padding: 0 5px; border-radius: 3px; color: #fff; }
    .site.encar { background: #e8432f; } .site.kcar { background: #c3002f; }
    a { color: #222; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    a:hover { text-decoration: underline; }
    .reason { color: #d32f2f; white-space: pre-wrap; word-break: break-all; }
    .meta { display: flex; justify-content: space-between; font-size: 11px; color: #999; }
    button { font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; }
    button:hover { border-color: #888; }
    .del { border: 0; color: #999; padding: 0 4px; }
    .del:hover { color: #d32f2f; }
    .empty { padding: 24px; text-align: center; color: #999; }
  </style>
</head>
<body>
  <header>
    <h1>거른 매물 <span id="count"></span></h1>
    <button id="export">내보내기</button>
    <button id="import">가져오기</button>
    <input id="file" type="file" accept="application/json" hidden />
  </header>
  <input id="q" type="search" placeholder="제목/사유/ID 검색" />
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
